name: snake-contributions

on:
  schedule:
    - cron: "0 0 * * *"        # 每天 UTC 0 点
  workflow_dispatch:            # 允许手动触发
  push:
    branches: [main]            # 改成你的默认分支

jobs:
  generate:
    permissions:
      contents: write           # 必须，否则推不动 output 分支
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 贪吃蛇 ----------
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}

      # ---------- Stats 卡片 ----------
      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&count_private=true
          path: dist/stats.svg
          token: ${{ secrets.UPDATE_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.UPDATE_TOKEN }}

      # ---------- 统一推送 output 分支 ----------
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets [skip ci]"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
