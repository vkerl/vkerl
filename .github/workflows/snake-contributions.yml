name: snake-contributions

on:
  schedule:
    - cron: "0 0 * * *"        # 每天 UTC 0 点
  workflow_dispatch:            # 允许手动触发
  push:
    branches: [main]            # main 有推送时也刷新一次（按需改成 master）

jobs:
  generate:
    permissions:
      contents: write           # 必须有写权限才能推送 output 分支
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 从贡献图生成贪吃蛇 SVG 动画
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # 抓贡献图需要鉴权；带 token 才能读私有仓库贡献，且不会被 GitHub API 限流
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}

      # 把生成的 SVG 推送到 output 分支
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake animation [skip ci]"
        env:
          # 这个 action 读环境变量，不是 with 参数
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
